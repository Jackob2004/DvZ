kits:
  warrior:
    activateMessage:
      message: "<red>You arrived to battle as a warrior!"
      broadcast: false

    attributes:
      - type: "MAX_HEALTH"
        amount: 10.0

    items:
      - material: "DIAMOND_AXE"
        name: "<b><red>Hardened sword"
        lore:
          - ""
          - "<green>[Right] <white>- click to activate ability"
          - "Launches you forward and upward"
          - "Gives you fall damage immunity for 4 sec"
          - "Cooldown (15 s)"
        enchantments:
          unbreaking: 4

      - material: "IRON_HELMET"
        name: "<red>Helmet"
        lore:
          - ""
          - "<gray>Rusty helmet."
        enchantments:
          unbreaking: 3

      - material: "DIAMOND_CHESTPLATE"
        name: "<b><red>Hardened plate"
        lore:
          - ""
          - "Be proud wearing it."
        enchantments:
          protection: 4
          unbreaking: 3
        trimMaterial: "iron"
        trimPattern: "sentry"

      - material: "IRON_LEGGINGS"
        name: "<red>Leggings"
        lore:
          - ""
          - "Rusty leggings."
        enchantments:
          unbreaking: 3
      - material: "IRON_BOOTS"
        name: "<red>Boots"
        lore:
          - ""
          - "Rusty boots."
        enchantments:
          unbreaking: 3

      - material: "POTION"
        name: "<red><u>Battle Potion"
        potionColor: "#BD1313"
        potionEffects:
          - type: "STRENGTH"
            durationSeconds: 120
            amplifier: 1
          - type: "REGENERATION"
            durationSeconds: 15
            amplifier: 1

    customItems:
      - id: RADIANCE_SHROOM

    kitAttributes:
      rampage: 2

  archer:
    activateMessage:
      message: "<green>You arrived to battle an archer!"
      broadcast: false

    attributes:
      - type: "MAX_HEALTH"
        amount: 4.0

    items:
      - material: "BOW"
        name: "<b><green>Light bow"
        lore:
          - ""
          - "<green>[Left] <white>- click to activate ability"
          - "Launches you backwards and lets you fall down slowly"
          - "Cooldown (10 s)"
        enchantments:
          unbreaking: 4

      - material: "CHAINMAIL_HELMET"
        name: "<green>Helmet"
        lore:
          - ""
          - "Old piece of armor"
        enchantments:
          unbreaking: 3
          projectile_protection: 1

      - material: "LEATHER_CHESTPLATE"
        name: "<b><green>Light plate"
        lore:
          - ""
          - "Light as a feather."
        enchantments:
          protection: 4
          unbreaking: 3
          projectile_protection: 3
        trimMaterial: "iron"
        trimPattern: "raiser"

      - material: "CHAINMAIL_LEGGINGS"
        name: "<green>Leggings"
        lore:
          - ""
          - "Old piece of armor"
        enchantments:
          unbreaking: 3
          projectile_protection: 1
      - material: "CHAINMAIL_BOOTS"
        name: "<green>Boots"
        lore:
          - ""
          - "Old piece of armor"
        enchantments:
          unbreaking: 3
          projectile_protection: 1

      - material: "POTION"
        name: "<green><u>Agility Potion"
        potionColor: "#BD1313"
        potionEffects:
          - type: "SPEED"
            durationSeconds: 120
            amplifier: 1
          - type: "JUMP_BOOST"
            durationSeconds: 15
            amplifier: 1

    kitAttributes:
      rampage: 1

  elf:
    activateMessage:
      message: "<b><green>Elf from Mirkwood has arrived"
      broadcast: true

    attributes:
      - type: "MAX_HEALTH"
        amount: 20.0
      - type: "FALL_DAMAGE_MULTIPLIER"
        amount: -1.0

    potions:
      - type: "SPEED"
        durationSeconds: 1000000
        amplifier: 1
      - type: "JUMP_BOOST"
        durationSeconds: 1000000
        amplifier: 1

    items:
      - material: "BOW"
        name: "<b><green>Nature's Wrath"
        lore:
          - ""
          - "<green>[Left] <white>- click to activate ability"
          - "Stand still to craft new arrows"
        enchantments:
          power: 2
          punch: 1
          unbreaking: 3

      - material: "DIAMOND_PICKAXE"
        name: "<b><green>Elven Blade"
        lore:
          - ""
          - "<green>[Right] <white>- click to activate ability"
          - "Launches you in in the direction your are looking"
          - "Cooldown 8 seconds"
        enchantments:
          sharpness: 4
          unbreaking: 3

      - material: "LEATHER_HELMET"
        name: "<b><green>Light Helmet"
        lore:
          - ""
          - "Forged by the elves of Mirkwood"
        enchantments:
          protection: 3
          projectile_protection: 2
          unbreaking: 3
        trimMaterial: "emerald"
        trimPattern: "silence"

      - material: "LEATHER_CHESTPLATE"
        name: "<b><green>Light Plate"
        lore:
          - ""
          - "Forged by the elves of Mirkwood"
        enchantments:
          protection: 3
          projectile_protection: 2
          unbreaking: 3
        trimMaterial: "emerald"
        trimPattern: "silence"

      - material: "LEATHER_LEGGINGS"
        name: "<b><green>Light Leggings"
        lore:
          - ""
          - "Forged by the elves of Mirkwood"
        enchantments:
          protection: 3
          projectile_protection: 2
          unbreaking: 3
        trimMaterial: "emerald"
        trimPattern: "silence"

      - material: "LEATHER_BOOTS"
        name: "<b><green>Light Boots"
        lore:
          - ""
          - "Forged by the elves of Mirkwood"
        enchantments:
          protection: 3
          projectile_protection: 2
          unbreaking: 3
        trimMaterial: "emerald"
        trimPattern: "silence"

    kitAttributes:
      rampage: 1

  zombie:
    activateMessage:
      message: "<green>You arrived to battle as a zombie"
      broadcast: false

    items:
      - material: "WOODEN_SWORD"
        name: "<b><dark_green>Rotten blade"
        enchantments:
          sharpness: 2
          unbreaking: 3

    kitAttributes:
      rampageImmune: false
  super_creeper:
    activateMessage:
      message: "<green>You arrived to battle as a super creeper"
      broadcast: false

    items:
      - material: "GUNPOWDER"
        name: "<b><dark_green>boom"

    kitAttributes:
      rampageImmune: false
  enderman:
    activateMessage:
      message: "<green>You arrived to battle as an enderman"
      broadcast: false

    items:
      - material: "ENDER_PEARL"
        name: "<b><dark_green>pearl"

    kitAttributes:
      rampageImmune: false

  skeleton:
    activateMessage:
      message: "<aqua>You arrived to battle as a skeleton"
      broadcast: false

    items:
      - material: "BOW"
        name: "<b><aqua>Dusty Bow"
      - material: "ARROW"
        name: "<gray>Arrow"
        amount: 32

    kitAttributes:
      rampageImmune: false

  creeper:
    activateMessage:
      message: "<green>You arrived to battle as a creeper"
      broadcast: false

    items:
      - material: "GUNPOWDER"
        name: "<green>Kaboom"
        lore:
          - ""
          - "Use to detonate yourself, it takes 3 seconds"
          - "<green>[Right] <white>click to start ignition"
          - "<green>[Left] <white>click to stop ignition"

    kitAttributes:
      rampageImmune: false