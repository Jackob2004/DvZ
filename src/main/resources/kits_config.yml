kits:
  warrior:
    activateMessage:
      message: "<red>You arrived to battle as a warrior!"
      broadcast: false

    attributes:
      - type: "MAX_HEALTH"
        amount: 10.0

    items:
      - material: "DIAMOND_CHESTPLATE"
        name: "<b><red>Hardened plate"
        lore:
          - "<gray>Be proud wearing it."
        enchantments:
          protection: 4
          unbreaking: 3
        trimMaterial: "iron"
        trimPattern: "sentry"

      - material: "POTION"
        name: "<red><u>Battle Potion"
        potionColor: "#BD1313"
        potionEffects:
          - type: "STRENGTH"
            durationSeconds: 120
            amplifier: 2

    customItems:
      - id: RADIANCE_SHROOM

  archer:
    activateMessage:
      message: "<green>You arrived to battle an archer!"
      broadcast: false

    attributes:
      - type: "MAX_HEALTH"
        amount: 4.0

    items:
      - material: "LEATHER_CHESTPLATE"
        name: "<b><green>Light plate"
        lore:
          - "<gray>Light as feather."
        enchantments:
          protection: 4
          unbreaking: 3

  elf:
    activateMessage:
      message: "<green>Elf from Mirkwood has arrived"
      broadcast: true

    attributes:
      - type: "MAX_HEALTH"
        amount: 20.0

    items:
      - material: "BOW"
        name: "<b><green>Nature's Wrath"
        enchantments:
          power: 5
          punch: 2
          unbreaking: 3